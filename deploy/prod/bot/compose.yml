name: sylph-bot

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-locked: &locked
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${SYLPH_SUBNET:-172.30.11.0/24}

services:
  perms:
    <<: *locked
    image: alpine:3.24.2
    user: "0:0"
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    network_mode: none
    volumes:
      - ./certs:/certs
      - ./data:/data
    command:
      - sh
      - -euc
      - |
        mkdir -p /data/caddy
        chown -R 0:0 /data/caddy
        chown -R 65532:65532 /certs
        chmod -R u=rX,go= /certs

  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    logging: *logging
    networks:
      default:
        ipv4_address: ${SYLPH_CADDY_IP:-172.30.11.10}
    ports:
      - "0.0.0.0:${SYLPH_HTTPS_PORT:-443}:443"
    environment:
      SYLPH_BOT_DOMAIN: ${SYLPH_BOT_DOMAIN:?set SYLPH_BOT_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy:/data
    depends_on:
      perms:
        condition: service_completed_successfully

  bot:
    <<: *locked
    image: ghcr.io/itg-labs/sylph-bot:${SYLPH_VERSION:?set SYLPH_VERSION in .env}
    restart: unless-stopped
    environment:
      SYLPH_BOT_TOKEN: ${SYLPH_BOT_TOKEN:?set SYLPH_BOT_TOKEN in .env}
      SYLPH_CORE_URL: ${SYLPH_CORE_URL:?set SYLPH_CORE_URL in .env}
      SYLPH_CORE_NAME: ${SYLPH_CORE_NAME:-core.sylph.internal}
      SYLPH_TLS_CERT: /certs/cert.pem
      SYLPH_TLS_KEY: /certs/key.pem
      SYLPH_CA_CERT: /certs/ca.pem
      SYLPH_SUBS_URL: ${SYLPH_SUBS_URL:?set SYLPH_SUBS_URL in .env}
      SYLPH_BOT_WEBHOOK_LISTEN: ":8080"
      SYLPH_BOT_TRUSTED_PROXIES: ${SYLPH_CADDY_IP:-172.30.11.10}/32
      SYLPH_BOT_TZ: ${SYLPH_BOT_TZ:-Europe/Moscow}
      SYLPH_BOT_CUSTOM_EMOJI: ${SYLPH_BOT_CUSTOM_EMOJI:-false}
      SYLPH_LOG_LEVEL: ${SYLPH_LOG_LEVEL:-info}
    volumes:
      - ./certs:/certs:ro
    healthcheck:
      test: ["CMD", "/sylph", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      perms:
        condition: service_completed_successfully
