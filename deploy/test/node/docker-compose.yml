name: sylph-test-node
services:
  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    command: ["-config", "/etc/pebble/pebble-config.json"]
    environment:
      PEBBLE_VA_NOSLEEP: "1"
    volumes:
      - ./pebble/pebble-config.json:/etc/pebble/pebble-config.json:ro
  roots:
    image: curlimages/curl:8.17.0
    user: root
    command: ["sh", "-c", "until curl -sfk https://pebble:15000/roots/0 -o /roots/root.pem; do sleep 1; done"]
    volumes:
      - roots:/roots
    depends_on:
      pebble:
        condition: service_started
  caddy:
    build: ../../caddy
    image: sylph-caddy:test
    extra_hosts:
      - "dest.test:127.0.0.1"
    volumes:
      - caddy-admin:/run/caddy-admin
      - ./pebble/minica.pem:/etc/pebble/minica.pem:ro
    networks:
      default:
        aliases: [cdn.test, rx.test]
  bootstrap:
    build:
      context: .
      dockerfile: agent.Dockerfile
    image: sylph-test-node-agent
    entrypoint: ["/sylph/sylph-agent", "bootstrap"]
    volumes:
      - xray-config:/etc/xray
  xray:
    image: ghcr.io/xtls/xray-core:26.10.21
    network_mode: service:caddy
    pid: service:caddy
    restart: unless-stopped
    command: ["run", "-c", "/etc/xray/config.json"]
    volumes:
      - xray-config:/etc/xray:ro
    depends_on:
      bootstrap:
        condition: service_completed_successfully
      caddy:
        condition: service_started
  client:
    image: ghcr.io/xtls/xray-core:26.10.21
    command: ["run", "-c", "/etc/sylph/client.json"]
    volumes:
      - ./client.json:/etc/sylph/client.json:ro
      - roots:/roots:ro
    depends_on:
      roots:
        condition: service_completed_successfully
  agent:
    image: sylph-test-node-agent
    network_mode: service:caddy
    pid: service:caddy
    entrypoint: ["/sylph/agent.test", "-test.run", "^TestNodeLive", "-test.v", "-test.count=1"]
    environment:
      SYLPH_TEST_NODE: "1"
      SYLPH_ACME_CA: https://pebble:14000/dir
      SYLPH_ACME_CA_ROOT: /etc/pebble/minica.pem
    volumes:
      - xray-config:/etc/xray
      - caddy-admin:/run/caddy-admin
    depends_on:
      xray:
        condition: service_started
      client:
        condition: service_started
    profiles: ["test"]
volumes:
  xray-config:
  caddy-admin:
  roots:
