name: sylph-test-subs
networks:
  e2e:
    internal: true
    ipam:
      config:
        - subnet: 11.73.0.0/24
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sylph
      POSTGRES_PASSWORD: sylph
      POSTGRES_DB: sylph
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U sylph -d sylph"]
      interval: 1s
      timeout: 3s
      retries: 30
    networks: [e2e]
  core:
    build: .
    image: sylph-test-subs
    entrypoint: ["/sylph/sylph-core"]
    environment:
      SYLPH_DB_URL: postgres://sylph:sylph@postgres:5432/sylph
      SYLPH_TLS_CERT: /ca/certs/core.sylph.internal/cert.pem
      SYLPH_TLS_KEY: /ca/certs/core.sylph.internal/key.pem
      SYLPH_CLIENT_CA: /ca/ca.pem
      SYLPH_LISTEN: ":8443"
    volumes:
      - ./bin/ca:/ca:ro
    networks:
      e2e:
        aliases: [core.sylph.internal]
    depends_on:
      postgres:
        condition: service_healthy
  caddy:
    build: ../../caddy
    image: sylph-caddy:test
    extra_hosts:
      - "mask.test:11.73.0.100"
    volumes:
      - caddy-admin:/run/caddy-admin
    networks:
      e2e:
        ipv4_address: 11.73.0.10
  bootstrap:
    extends:
      file: ../../prod/node/compose.yml
      service: bootstrap
    image: sylph-agent:test
    depends_on: !reset {}
    volumes: !override
      - xray-config:/etc/xray
      - xray-geo:/usr/local/share/xray/sylph
  xray:
    extends:
      file: ../../prod/node/compose.yml
      service: xray
    volumes: !override
      - xray-config:/etc/xray:ro
      - xray-geo:/usr/local/share/xray/sylph:ro
    depends_on: !override
      bootstrap:
        condition: service_completed_successfully
      caddy:
        condition: service_started
  agent:
    extends:
      file: ../../prod/node/compose.yml
      service: agent
    image: sylph-agent:test
    environment:
      SYLPH_CA_CERT: /ca/ca.pem
      SYLPH_SYNC_INTERVAL: 2s
    volumes: !override
      - agent-state:/var/lib/sylph-agent
      - xray-config:/etc/xray
      - xray-geo:/usr/local/share/xray/sylph
      - caddy-admin:/run/caddy-admin
      - ./bin/ca/certs/node-1:/certs:ro
      - ./bin/ca:/ca:ro
    depends_on: !override
      xray:
        condition: service_started
      core:
        condition: service_started
  caddy-2:
    image: sylph-caddy:test
    extra_hosts:
      - "mask.test:11.73.0.100"
    volumes:
      - caddy-admin-2:/run/caddy-admin
    networks:
      e2e:
        ipv4_address: 11.73.0.11
    depends_on:
      caddy:
        condition: service_started
  bootstrap-2:
    extends:
      file: ../../prod/node/compose.yml
      service: bootstrap
    image: sylph-agent:test
    depends_on: !override
      bootstrap:
        condition: service_completed_successfully
    volumes: !override
      - xray-config-2:/etc/xray
      - xray-geo-2:/usr/local/share/xray/sylph
  xray-2:
    extends:
      file: ../../prod/node/compose.yml
      service: xray
    network_mode: service:caddy-2
    pid: service:caddy-2
    volumes: !override
      - xray-config-2:/etc/xray:ro
      - xray-geo-2:/usr/local/share/xray/sylph:ro
    depends_on: !override
      bootstrap-2:
        condition: service_completed_successfully
      caddy-2:
        condition: service_started
  agent-2:
    extends:
      file: ../../prod/node/compose.yml
      service: agent
    image: sylph-agent:test
    network_mode: service:caddy-2
    pid: service:caddy-2
    environment:
      SYLPH_CA_CERT: /ca/ca.pem
      SYLPH_SYNC_INTERVAL: 2s
    volumes: !override
      - agent-state-2:/var/lib/sylph-agent
      - xray-config-2:/etc/xray
      - xray-geo-2:/usr/local/share/xray/sylph
      - caddy-admin-2:/run/caddy-admin
      - ./bin/ca/certs/node-2:/certs:ro
      - ./bin/ca:/ca:ro
    depends_on: !override
      xray-2:
        condition: service_started
      core:
        condition: service_started
  subs:
    image: sylph-test-subs
    entrypoint: ["/sylph/sylph-subs"]
    environment:
      SYLPH_CORE_URL: https://core.sylph.internal:8443
      SYLPH_TLS_CERT: /ca/certs/subs/cert.pem
      SYLPH_TLS_KEY: /ca/certs/subs/key.pem
      SYLPH_CA_CERT: /ca/ca.pem
    volumes:
      - ./bin/ca:/ca:ro
    networks: [e2e]
    depends_on:
      core:
        condition: service_started
  runner:
    image: sylph-test-subs
    entrypoint: ["/sylph/subs.test", "-test.run", "^TestSubsLive$$", "-test.v", "-test.count=1"]
    environment:
      SYLPH_TEST_SUBS: "1"
      SYLPH_E2E_CORE: https://core.sylph.internal:8443
      SYLPH_E2E_SUBS: http://subs:8080
      SYLPH_E2E_NODE: 11.73.0.10
      SYLPH_E2E_NODE2: 11.73.0.11
      SYLPH_E2E_TARGET: 11.73.0.100
      SYLPH_E2E_CA: /ca/ca.pem
      SYLPH_E2E_PANEL_CERT: /ca/certs/panel/cert.pem
      SYLPH_E2E_PANEL_KEY: /ca/certs/panel/key.pem
    volumes:
      - ./bin/ca:/ca:ro
    networks:
      e2e:
        ipv4_address: 11.73.0.100
    depends_on:
      agent:
        condition: service_started
      agent-2:
        condition: service_started
      subs:
        condition: service_started
    profiles: ["test"]
volumes:
  xray-config:
  xray-geo:
  agent-state:
  caddy-admin:
  xray-config-2:
  xray-geo-2:
  agent-state-2:
  caddy-admin-2:
