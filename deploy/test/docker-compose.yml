services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sylph
      POSTGRES_PASSWORD: sylph
      POSTGRES_DB: sylph_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sylph -d sylph_test"]
      interval: 1s
      timeout: 3s
      retries: 30
