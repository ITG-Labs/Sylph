name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sylph
          POSTGRES_PASSWORD: sylph
          POSTGRES_DB: sylph_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sylph -d sylph_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SYLPH_TEST_DB: postgres://sylph:sylph@localhost:55432/sylph_test
      SYLPH_TEST_XRAY: 127.0.0.1:55085
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
      - run: docker compose -f deploy/test/xray/docker-compose.yml up -d --wait
      - run: go test -race -count=1 ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/... ./services/monitor/... ./tools/sylph/...
      - run: make test-node
      - run: make test-subs
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "services/core", "services/agent", "services/cron", "services/subs", "services/bot", "services/panel", "services/monitor", "tools/sylph"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/panel/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/panel/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
      - run: go vet ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/... ./services/monitor/... ./tools/sylph/...
      - run: go build ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/... ./services/monitor/... ./tools/sylph/...
  images:
    if: github.event_name == 'push'
    needs: [test, lint, web, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: images-${{ github.ref }}-${{ matrix.image }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sylph-core
            file: deploy/service.Dockerfile
            context: .
            service: core
          - image: sylph-cron
            file: deploy/service.Dockerfile
            context: .
            service: cron
          - image: sylph-subs
            file: deploy/service.Dockerfile
            context: .
            service: subs
          - image: sylph-bot
            file: deploy/service.Dockerfile
            context: .
            service: bot
          - image: sylph-monitor
            file: deploy/service.Dockerfile
            context: .
            service: monitor
          - image: sylph-panel
            file: deploy/panel/Dockerfile
            context: .
          - image: sylph-agent
            file: deploy/agent/Dockerfile
            context: .
          - image: sylph-caddy
            file: deploy/caddy/Dockerfile
            context: deploy/caddy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ghcr.io/itg-labs/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: stable
        if: matrix.image == 'sylph-caddy'
        run: |
          tag=$(sed -n 's/^CADDY_VERSION=//p' deploy/prod/node/.env.example)
          ref="ghcr.io/itg-labs/sylph-caddy:$tag"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "$ref is already published: never re-push it, nodes would recreate Caddy and xray"
          elif grep -qi "not found" <<<"$out"; then
            echo "tags=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "$out"
            exit 1
          fi
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.stable.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
  installer:
    if: github.event_name == 'push'
    needs: [images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: installer-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.work
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: build
        env:
          VERSION: ${{ steps.version.outputs.value }}
        working-directory: tools/sylph
        run: |
          mkdir -p ../../dist
          GOWORK=off CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags="-s -w -X github.com/ITG-Labs/sylph/internal/version.Version=${VERSION}" \
            -o ../../dist/sylph-linux-amd64 .
          ../../dist/sylph-linux-amd64 version
          cd ../../dist && sha256sum sylph-linux-amd64 > SHA256SUMS
      - name: release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Installer: curl -fLo sylph https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/sylph-linux-amd64 && chmod +x sylph && sudo ./sylph install"
      - name: edge
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="edge-${GITHUB_SHA::7}"
          notes="Build of main at $GITHUB_SHA. Images: sha-${GITHUB_SHA::7}. Installer: curl -fLo sylph https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/sylph-linux-amd64 && chmod +x sylph"
          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$draft" = true ]; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          if [ "$draft" != false ]; then
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "$tag" --notes "$notes"
          fi
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,isDraft,isPrerelease,publishedAt \
            --jq '[.[] | select(.isPrerelease and (.isDraft | not) and (.tagName | startswith("edge-")))] | sort_by(.publishedAt) | reverse | .[3:][].tagName' |
            while read -r old; do
              gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
