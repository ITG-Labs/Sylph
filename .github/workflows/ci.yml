name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sylph
          POSTGRES_PASSWORD: sylph
          POSTGRES_DB: sylph_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sylph -d sylph_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SYLPH_TEST_DB: postgres://sylph:sylph@localhost:55432/sylph_test
      SYLPH_TEST_XRAY: 127.0.0.1:55085
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: docker compose -f deploy/test/xray/docker-compose.yml up -d --wait
      - run: go test -race -count=1 ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/...
      - run: make test-node
      - run: make test-subs
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "services/core", "services/agent", "services/cron", "services/subs", "services/bot", "services/panel"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: ${{ matrix.module }}
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/panel/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: services/panel/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
      - run: go vet ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/...
      - run: go build ./... ./services/core/... ./services/agent/... ./services/cron/... ./services/subs/... ./services/bot/... ./services/panel/...
  images:
    if: github.event_name == 'push'
    needs: [test, lint, web, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: sylph-core
            file: deploy/service.Dockerfile
            context: .
            service: core
          - image: sylph-cron
            file: deploy/service.Dockerfile
            context: .
            service: cron
          - image: sylph-subs
            file: deploy/service.Dockerfile
            context: .
            service: subs
          - image: sylph-bot
            file: deploy/service.Dockerfile
            context: .
            service: bot
          - image: sylph-panel
            file: deploy/panel/Dockerfile
            context: .
          - image: sylph-agent
            file: deploy/agent/Dockerfile
            context: .
          - image: sylph-caddy
            file: deploy/caddy/Dockerfile
            context: deploy/caddy
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=edge-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/itg-labs/${{ matrix.image }}
          tags: |
            type=edge,branch=main
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          build-args: |
            SERVICE=${{ matrix.service }}
            VERSION=${{ steps.version.outputs.value }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
