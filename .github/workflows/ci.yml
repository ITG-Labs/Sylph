name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sylph
          POSTGRES_PASSWORD: sylph
          POSTGRES_DB: sylph_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U sylph -d sylph_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      SYLPH_TEST_DB: postgres://sylph:sylph@localhost:55432/sylph_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: go test -race -count=1 ./... ./services/core/... ./services/agent/...
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [".", "services/core", "services/agent"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: ${{ matrix.module }}
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
      - run: go vet ./... ./services/core/... ./services/agent/...
      - run: go build ./... ./services/core/... ./services/agent/...
