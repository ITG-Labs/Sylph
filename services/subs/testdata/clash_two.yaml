    type: vless
    server: nl1.example.com
    port: 443
    uuid: 091192b5-1fd3-4aeb-9733-810ef24c2964
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.apple.com
    client-fingerprint: chrome
    reality-opts:
      public-key: EznkPne5ZLOrLvDbqseDQycq-ca9v1kEytFwD1-fy3s
      short-id: 98b7a90e659d766f
      support-x25519mlkem768: true
  - name: Финляндия
    type: vless
    server: 2001:db8::1
    port: 443
    uuid: 091192b5-1fd3-4aeb-9733-810ef24c2964
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: fi.example.org
