<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#12121d"><title>Sylph · Подписка</title>
<link rel="icon" href="./brand.svg"><link rel="stylesheet" href="./panel-glass.css">
<style>
@font-face{font-family:Inter;src:url('./inter-cyrillic-wght-normal.woff2');font-weight:100 900;unicode-range:U+0400-052F}
@font-face{font-family:Inter;src:url('./inter-latin-wght-normal.woff2');font-weight:100 900;unicode-range:U+0000-00FF,U+2000-206F}
*{box-sizing:border-box}body{margin:0;color:var(--foreground);background:var(--background);font:15px/1.48 Inter,system-ui,sans-serif;color-scheme:dark;isolation:isolate;min-height:100vh}header,main{width:min(1000px,calc(100% - 40px));margin:auto}header{padding:32px 0 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;font-size:22px;font-weight:680;letter-spacing:-.06em}header img{width:32px;height:32px}.heading,.line{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading{margin:32px 0 22px}.status{padding:5px 11px;color:#a5f4ce;font-size:13px;background:#21463b88;border:1px solid #a1f2cd30;border-radius:30px}.status:before{content:'●';font-size:10px;margin-right:7px}h1,h2,p{margin:0}h1{font-size:clamp(31px,5vw,46px);letter-spacing:-.067em;font-weight:600;line-height:1.12}h2{font-size:21px;font-weight:585;letter-spacing:-.045em}.muted,small{color:var(--muted-foreground)}main{padding-bottom:38px}.grid{display:grid;grid-template-columns:minmax(0,1.48fr) minmax(270px,1fr);gap:16px;align-items:stretch}.card{border-radius:25px;padding:27px;min-width:0}.traffic{grid-column:1}.connect{grid-column:2;grid-row:1/3;display:flex;flex-direction:column}.history{grid-column:1}.amount{display:flex;align-items:baseline;gap:8px;margin:11px 0 16px}.amount b{font-size:clamp(49px,7vw,69px);line-height:1.04;letter-spacing:-.07em;font-weight:565}.amount span{font-size:23px;color:#d4cde4}.meter{height:7px;border-radius:9px;background:#ffffff17;overflow:hidden}.meter i{display:block;width:36.8%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#9271ec,#ccacff)}.labels{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:8px 0 19px}.expiry{padding-top:14px;border-top:1px solid var(--border);display:flex;justify-content:space-between;gap:12px}.qrbox{display:grid;place-items:center;margin:18px auto;width:min(100%,214px);border:0;border-radius:18px;background:#fff;padding:0;overflow:hidden;cursor:zoom-in}.qrbox img,dialog img{width:100%;display:block;image-rendering:pixelated}.connect p{font-size:14px;margin-top:5px}.actions{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-top:auto;padding-top:15px}button,select,a{font:inherit}button,select{cursor:pointer}select,button.soft,.primary{border:1px solid #ffffff25;border-radius:12px;padding:10px 12px;text-align:center}.primary{background:#b9a5fc;color:#201936;font-weight:650;text-decoration:none}.soft,select{background:#272735;color:#edeaf7}.copy{margin-top:auto;width:100%}.history small{font-size:13px}.seg{display:flex;background:#0a091955;border-radius:10px;padding:3px}.seg button{background:none;color:#c6c1d7;border:0;border-radius:8px;padding:5px 9px;font-size:12px}.seg button[aria-pressed=true]{background:#ffffff22;color:white}.plot{display:flex;align-items:stretch;height:90px;gap:3px;border-bottom:1px solid var(--border);margin-top:18px;background:repeating-linear-gradient(to top,transparent 0 29px,#ffffff0d 29px 30px)}.bar{flex:1;min-width:0;padding:0 2px;border:0;background:transparent;display:flex;align-items:flex-end;justify-content:center}.bar i{display:block;width:100%;max-width:32px;background:linear-gradient(#b6a1ff,#7664cc);border-radius:4px 4px 0 0;opacity:.69}.bar[aria-pressed=true] i,.bar:hover i{background:linear-gradient(#c7f6ff,#7cb7de);opacity:1}.ends,.detail{display:flex;justify-content:space-between;gap:10px}.ends{font-size:12px;color:var(--muted-foreground);margin:5px 0 10px}.detail{color:#ece8ff;font-size:14px}.detail b{font-weight:550}.detail span{color:#cad5e6}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c3b5fc;outline-offset:2px}dialog{width:min(385px,90vw);background:#242231;border:1px solid var(--border);padding:20px;color:#fff;border-radius:22px}dialog img{border-radius:14px;margin-top:14px}dialog::backdrop{background:#060612c9}dialog button{border:0;border-radius:50%;width:32px;height:32px;background:#ffffff19;color:white;font-size:21px}#feedback:not(:empty){display:block;margin-top:6px}
@media(max-width:700px){header,main{width:calc(100% - 28px)}header{padding:17px 0 14px}.heading{margin:21px 0 16px}.grid{display:flex;flex-direction:column;gap:12px}.card{padding:20px;border-radius:21px}.connect{display:grid;grid-template-columns:minmax(0,1fr) 130px;gap:0 10px;align-items:center}.qrbox{grid-column:2;grid-row:1/3;margin:0}.copy,#feedback{grid-column:1/-1}.copy{margin-top:15px}.connect h2{align-self:end}.connect p{align-self:start}.bar{padding:0}.plot{gap:3px}}

.connect{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0}
.connect h2,.connect p{align-self:center}
.connect p{max-width:30ch}
.connect .qrbox{width:min(100%,214px);margin:18px 0}
.connect .copy{width:min(100%,260px);margin:0}
@media(max-width:700px){.connect .qrbox{width:min(100%,168px);margin:14px 0}}
</style></head><body>
<div class="app-backdrop" aria-hidden="true"><span class="blob-violet"></span><span class="blob-teal"></span><span class="blob-indigo"></span><span class="blob-rose"></span></div>
<header><img src="./brand.svg" alt="">Sylph</header><main>
<div class="heading"><h1>Моя подписка</h1><span class="status">Активна</span></div>
<div class="grid"><section class="glass card traffic"><h2>Остаток трафика</h2><div class="amount"><b>63,2</b><span>ГБ</span></div><div class="meter" aria-hidden="true"><i></i></div>
<div class="labels muted"><span>Использовано 36,8 ГБ</span><span>из 100 ГБ</span></div><div class="expiry"><span class="muted">Оплачено до</span><strong>28 декабря</strong></div></section>
<section class="glass card connect"><h2>Подключить устройство</h2><p class="muted">Отсканируй QR-код или скопируй ссылку для ручного импорта.</p>
<button class="qrbox" aria-label="Увеличить QR-код"><img src="./subscription-qr.png" alt="QR-код демоподписки"></button>
<button class="soft copy">Скопировать ссылку</button><small role="status" id="feedback"></small></section>
<section class="glass card history"><div class="line"><h2>Трафик по дням</h2><div class="seg" aria-label="Период"><button aria-pressed="true" data-days="7">7 дн.</button><button aria-pressed="false" data-days="30">30 дн.</button></div></div>
<div class="plot" role="group" aria-label="Выбрать день"></div><div class="ends muted"></div><div class="detail" aria-live="polite"></div></section></div></main>
<dialog><div class="line"><h2>QR-код подписки</h2><button aria-label="Закрыть">×</button></div><img src="./subscription-qr.png" alt="Увеличенный QR-код демоподписки"></dialog>
<script>
const $=s=>document.querySelector(s),link='http://192.168.2.120:52907/s/demo',dlg=$('dialog');
$('.qrbox').onclick=()=>dlg.showModal();dlg.querySelector('button').onclick=()=>dlg.close();
$('.copy').onclick=async()=>{let ok=false;try{if(navigator.clipboard){await navigator.clipboard.writeText(link);ok=true}else{const t=document.createElement('textarea');t.value=link;document.body.append(t);t.select();ok=document.execCommand('copy');t.remove()}}catch{}$('#feedback').textContent=ok?'Ссылка скопирована':link};
const samples=[6,10,7,16,4,11,17,12,8,23,5,9,7,15,4,11,22,10,16,7,12,9,17,25,10,19,9,15,18,14];
const day=i=>new Intl.DateTimeFormat('ru',{day:'numeric',month:'short',timeZone:'UTC'}).format(new Date(Date.UTC(2026,9,30+i)));
function render(n){const plot=$('.plot'),start=samples.length-n;plot.replaceChildren();const max=Math.max(...samples.slice(start));function choose(i){for(const b of plot.children)b.setAttribute('aria-pressed',String(+b.dataset.index===i));const total=(samples[i]/10).toLocaleString('ru');$('.detail').innerHTML='<b>'+day(i)+'</b><span>'+total+' ГБ за день</span>'}
for(let i=start;i<samples.length;i++){const b=document.createElement('button');b.className='bar';b.dataset.index=i;b.setAttribute('aria-label',day(i));b.innerHTML='<i style="height:'+samples[i]/max*100+'%"></i>';b.onclick=()=>choose(i);plot.append(b)}
$('.ends').innerHTML='<span>'+day(start)+'</span><span>'+day(29)+'</span>';choose(29)}
for(const b of document.querySelectorAll('.seg button'))b.onclick=()=>{for(const x of document.querySelectorAll('.seg button'))x.setAttribute('aria-pressed',String(x===b));render(+b.dataset.days)};render(7)
</script></body></html>
